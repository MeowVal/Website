---
deployment:
  tasks:
    - export DEPLOYPATH=/home/catkatny/public_html/
    - cd /home/catkatny/website
    - export npm_config_cache=/home/catkatny/.npm-cache
    - /home/catkatny/nodevenv/nodeapp/22/bin/npm install --production=false 2>&1 | tee npm-install.log
    - /home/catkatny/nodevenv/nodeapp/22/bin/npm run build 2>&1 | tee npm-build.log
    - mkdir -p /home/catkatny/.deploy-tmp
    - rsync -av dist/ /home/catkatny/.deploy-tmp/ 2>&1 | tee deploy-stage.log
    - rsync -av --delete /home/catkatny/.deploy-tmp/ $DEPLOYPATH 2>&1 | tee deploy.log
    - rm -rf /home/catkatny/.deploy-tmp